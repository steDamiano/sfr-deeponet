[project]
name = "sfrnop"
version = "0.1.0"
description = ""
authors = [
    {name = "Stefano Damiano"}
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "torch (>=2.9.1,<3.0.0)",
    "torchaudio (>=2.9.1,<3.0.0)",
    "torchvision (>=0.24.1,<0.25.0)",
    "numpy (<2.0)",
    "torchinfo (>=1.8.0,<2.0.0)",
    "matplotlib",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "hydra-core (>=1.3.2,<2.0.0)",
    "coolname (>=2.2.0,<3.0.0)",
    "lightning (>=2.6.0,<3.0.0)",
    "h5py (>=3.15.1,<4.0.0)",
    "pandas (>=2.3.3,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "wandb (>=0.24.0,<0.25.0)",
    "ipython (>=9.9.0,<10.0.0)",
    "ipykernel (>=7.1.0,<8.0.0)"
]
